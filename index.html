<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waypoint — Travel Cost Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2A4A;
  --ink-soft:#3B4A6B;
  --paper:#F7F3E9;
  --paper-dim:#EFE9D8;
  --brass:#B8863C;
  --brass-dim:#D9BE8C;
  --stamp:#A8443B;
  --stamp-soft:#F4E3E0;
  --line:#D8CFB8;
  --white:#FFFDF9;
  --ok:#2F6B4F;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--ink);font-family:'IBM Plex Sans',sans-serif;color:var(--ink);}
.app{max-width:1180px;margin:0 auto;background:var(--paper);min-height:100vh;}
h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:600;margin:0;}
.mono{font-family:'IBM Plex Mono',monospace;}

/* ===== Header ===== */
.header{background:var(--ink);color:var(--paper);padding:28px 32px 22px;position:relative;overflow:hidden;}
.header::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border:1px solid rgba(247,243,233,.12);border-radius:50%;}
.header::before{content:"";position:absolute;right:20px;bottom:-90px;width:220px;height:220px;border:1px solid rgba(247,243,233,.08);border-radius:50%;}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;position:relative;z-index:1;}
.brand{display:flex;align-items:baseline;gap:12px;}
.brand h1{font-size:30px;letter-spacing:.3px;}
.brand .tag{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--brass-dim);}
.homebar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;position:relative;z-index:1;}
.homebar select{background:rgba(247,243,233,.14);border:1px solid rgba(247,243,233,.4);color:var(--paper);padding:7px 10px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
.homebar select:hover{background:rgba(247,243,233,.2);}
.homebar select:disabled{opacity:.5;cursor:not-allowed;}
/* Fix: some browsers render a <select>'s OPEN option list with a system white background
   regardless of the select's own background-color, while still inheriting our light `color`
   meant for the closed control on the dark header — producing pale-on-white text in the
   dropdown list. Force readable dark-on-light explicitly for every option so the open list
   is never low-contrast, independent of what the closed control looks like. */
.homebar select option{color:var(--ink);background:var(--white);}
.homebar label{color:var(--brass-dim);font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:1px;}
::placeholder{color:#6b6350;opacity:1;}
select option{color:var(--ink);background:var(--white);}
select:disabled,input:disabled{opacity:.55;cursor:not-allowed;}

/* ===== Nav ===== */
.tabs{display:flex;background:var(--white);border-bottom:1px solid var(--line);overflow-x:auto;}
.tab{padding:14px 20px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;color:var(--ink-soft);border-bottom:3px solid transparent;white-space:nowrap;}
.tab.active{color:var(--ink);border-bottom-color:var(--brass);font-weight:600;}
.tab .n{display:inline-block;background:var(--paper-dim);color:var(--ink-soft);border-radius:10px;padding:1px 7px;font-size:10.5px;margin-left:6px;}

.view{padding:26px 32px 60px;}
.section-title{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.section-title h2{font-size:22px;}
.section-sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:18px;}

/* ===== Cards ===== */
.card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr;}}
.field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);margin-bottom:6px;}
select,input[type=text],input[type=number],input[type=url],input[type=date]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:'IBM Plex Sans',sans-serif;background:var(--white);color:var(--ink);}
input:focus,select:focus{outline:2px solid var(--brass);outline-offset:1px;}
button{cursor:pointer;font-family:'IBM Plex Sans',sans-serif;}
.btn{background:var(--ink);color:var(--paper);border:none;padding:10px 18px;border-radius:6px;font-size:13.5px;font-weight:600;}
.btn:hover{background:var(--ink-soft);}
.btn.brass{background:var(--brass);color:var(--ink);}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn.stamp{background:var(--stamp);color:var(--white);}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:5px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.pill{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--ink-soft);}
.pill.official{background:#E7F0EA;color:var(--ok);border-color:#BFDDC9;}
.pill.tourism{background:#E9EFF7;color:#2C4B7C;border-color:#C7D6EC;}
.pill.secondary{background:#FBF1DD;color:#8A6316;border-color:#EAD7A9;}
.pill.stale{background:var(--stamp-soft);color:var(--stamp);border-color:#E4C1BC;}
.pill.manual{background:#F0EAF4;color:#6B3E8C;border-color:#DBC9E6;}

.empty{padding:40px 20px;text-align:center;color:var(--ink-soft);border:1px dashed var(--line);border-radius:10px;background:var(--white);}
.empty h3{font-size:16px;margin-bottom:6px;}

/* country/place chooser */
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--paper-dim);border:1px solid var(--line);border-radius:20px;padding:6px 12px 6px 14px;font-size:13px;margin:3px 6px 3px 0;}
.chip button{background:none;border:none;color:var(--stamp);font-weight:700;padding:0 2px;font-size:14px;}
.searchbox{position:relative;}
.searchresults{position:absolute;top:100%;left:0;right:0;background:var(--white);border:1px solid var(--line);border-top:none;max-height:220px;overflow-y:auto;z-index:20;border-radius:0 0 6px 6px;box-shadow:0 8px 20px rgba(0,0,0,.08);}
.searchresults div{padding:8px 12px;font-size:13.5px;cursor:pointer;}
.searchresults div:hover{background:var(--paper-dim);}

.place-item{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px;background:var(--white);}
.place-item .rowtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.item-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--paper-dim);font-size:13.5px;}
.item-row:first-of-type{border-top:none;}
.item-meta{color:var(--ink-soft);font-size:12px;margin-top:2px;}
.qty-input{width:56px;padding:5px 6px;font-size:13px;}

.loading-line{display:flex;align-items:center;gap:8px;color:var(--ink-soft);font-size:13px;padding:10px 0;}
.spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.warn-banner{background:var(--stamp-soft);border:1px solid #E4C1BC;color:#7A2E27;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;}
.note{font-size:12px;color:var(--ink-soft);margin-top:4px;}

/* boarding pass total */
.boardingpass{background:var(--ink);color:var(--paper);border-radius:14px;padding:0;display:flex;overflow:hidden;position:relative;box-shadow:0 12px 30px rgba(27,42,74,.35);}
.bp-main{flex:1;padding:26px 30px;}
.bp-stub{width:200px;background:rgba(247,243,233,.06);padding:26px 22px;border-left:2px dashed rgba(247,243,233,.35);position:relative;}
.bp-main .lbl,.bp-stub .lbl{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--brass-dim);}
.bp-total{font-family:'Fraunces',serif;font-size:44px;font-weight:700;margin-top:6px;}
.bp-range{font-family:'Fraunces',serif;font-size:30px;font-weight:700;margin-top:6px;}
.bp-sub{font-size:12.5px;color:rgba(247,243,233,.7);margin-top:6px;}
.bp-punch{position:absolute;width:22px;height:22px;background:var(--paper);border-radius:50%;left:-13px;}
.bp-punch.top{top:-11px;}
.bp-punch.bot{bottom:-11px;}

.cat-total-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px;}
.cat-total{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:14px;}
.cat-total .lbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);}
.cat-total .amt{font-family:'Fraunces',serif;font-size:20px;margin-top:4px;}

.country-block{margin-bottom:26px;}
.country-head{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:10px;}
.country-head h3{font-size:19px;}
.country-head .amt{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:15px;}

a.srclink{color:var(--brass);font-weight:600;text-decoration:none;border-bottom:1px solid var(--brass-dim);}
a.srclink:hover{color:var(--ink);}

table.srctable{width:100%;border-collapse:collapse;font-size:13px;}
table.srctable th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);padding:8px 10px;border-bottom:2px solid var(--ink);}
table.srctable td{padding:9px 10px;border-bottom:1px solid var(--paper-dim);vertical-align:top;}
</style>
</head>

const CCY_INDEX = Object.fromEntries(CURRENCIES.map(c=>[c.code,c]));
const TODAY = new Date("2026-08-24"); // app "current date" context for staleness checks

function fmtDate(d){ return d.toISOString().slice(0,10); }
function daysSince(dateStr){
  const d = new Date(dateStr);
  if(isNaN(d)) return 9999;
  return Math.round((TODAY - d)/86400000);
}
function ccySym(code){ return (CCY_INDEX[code]&&CCY_INDEX[code].symbol) || code; }
function money(amount, code){
  if(amount===null||amount===undefined||isNaN(amount)) return "—";
  return ccySym(code)+" "+amount.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+(CCY_INDEX[code]?"":" "+code);
}
function uid(){ return Math.random().toString(36).slice(2,10); }
// Logging must never be able to break application logic. This sandboxed runtime doesn't
// reliably expose a callable console.debug (and possibly not other console methods either),
// so every log call is routed through this guard rather than calling console.* directly.
function safeDebug(...args){
  try{
    if(typeof console !== "undefined" && console && typeof console.debug === "function"){
      console.debug(...args);
    } else if(typeof console !== "undefined" && console && typeof console.log === "function"){
      console.log(...args);
    }
  }catch(_e){ /* never let logging break the app */ }
}
function safeError(...args){
  try{
    if(typeof console !== "undefined" && console && typeof console.error === "function"){
      console.error(...args);
    } else {
      safeDebug(...args);
    }
  }catch(_e){ /* never let logging break the app */ }
}
// Safe event-binding helper: dynamically created UI means an element may legitimately not exist
// yet (e.g. an empty-state view with no button). Never assume — always guard.
function on(id, evt, handler){
  const el = document.getElementById(id);
  if(el) el['on'+evt] = handler;
  return el;
}

/* ============================= STATE ============================= */
let state = {
  homeCountry: null, // iso2
  homeCurrency: null, // code
  countries: [],     // { iso2, name, currency, places:[...] }
  eurRateCache: {},   // CCY -> {rate (1 EUR = rate CCY), date, sourceName, sourceUrl}
  searchCache: {},     // normalized place-search key -> cached result object (session-only)
  candidateCache: {},  // normalized candidate-search key -> cached result object (session-only)
  activeTab: 'trip'
};

function normalizeQuery(s){
  return (s||'').toLowerCase().trim().replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ');
}
function searchCacheKey(countryIso2, name, type, city, region, island){
  return [countryIso2, normalizeQuery(name), (type||'').toLowerCase(), normalizeQuery(city), normalizeQuery(region), normalizeQuery(island)].join('::');
}

function findCountry(iso2){ return state.countries.find(c=>c.iso2===iso2); }

function ensureCountry(iso2){
  let c = findCountry(iso2);
  if(!c){
    const base = COUNTRIES.find(x=>x.iso2===iso2);
    c = {iso2, name: base.name, currency: base.currency, places: []};
    state.countries.push(c);
  }
  return c;
}

/* =============================================================================
   SEARCH & EXCHANGE-RATE BACKENDS
   ---------------------------------------------------------------------------
   Earlier builds of this app called api.anthropic.com directly from the browser
   for both place/price search and currency lookups. That only worked inside
   Claude.ai's own sandboxed preview (which transparently authenticates and
   routes that one domain) -- on an independently hosted site like Netlify, an
   unauthenticated browser call to api.anthropic.com will simply fail (missing
   API key / CORS), the same way the search feature kept failing here. So both
   search and currency conversion now go through small server-side endpoints
   instead: no Claude/Waypoint dependency, no Claude session or usage limits.

   - SEARCH_BACKEND_URL  -> a Netlify Function that proxies a SearXNG instance
     (see netlify/functions/search.js in this delivery).
   - FX_BACKEND_URL      -> a Netlify Function that proxies the ECB's public
     daily reference-rate feed (see netlify/functions/fxrate.js).
   Both are same-origin relative paths, so the browser talks only to your own
   Netlify domain -- the SearXNG/ECB calls happen server-to-server, where CORS
   doesn't apply and no credentials are exposed to the client.
   ============================================================================= */
const SEARCH_BACKEND_URL = '/.netlify/functions/search';
const FX_BACKEND_URL = '/.netlify/functions/fxrate';

// Plain Promise.race timeout -- no AbortController/AbortSignal, since this app has
// previously hit an environment where a signal couldn't cross a postMessage boundary.
function fetchBackendJson(url, body, timeoutMs){
  const ms = timeoutMs || 15000;
  const fetchPromise = fetch(url, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body)
  }).then(async response=>{
    let json = null;
    try{ json = await response.json(); }catch(e){ /* fall through to INTERNAL_ERROR below */ }
    if(!response.ok){
      const err = new Error(`HTTP ${response.status}`);
      err.status = response.status;
      err.detail = json;
      err.kind = (response.status >= 500 || response.status === 429) ? 'provider' : 'http';
      throw err;
    }
    if(!json){ const e = new Error('Malformed response'); e.kind='parse'; throw e; }
    return json;
  }).catch(e=>{
    if(!e.kind) e.kind = 'network'; // fetch threw before any response existed (offline, DNS, endpoint down, etc.)
    throw e;
  });
  const timeoutPromise = new Promise((_, reject)=>{
    setTimeout(()=>{ const te = new Error('Request timed out'); te.kind='network'; reject(te); }, ms);
  });
  return Promise.race([fetchPromise, timeoutPromise]);
}

// One retry, ONLY for a genuine transient network failure -- never for a clean 4xx and
// never a retry loop against a provider that's already reporting itself unavailable.
async function callBackend(url, body, timeoutMs, debugLabel){
  const reqId = uid();
  safeDebug(`[search] request start`, {requestId:reqId, label:debugLabel||'query', url});
  try{
    const json = await fetchBackendJson(url, body, timeoutMs);
    safeDebug(`[search] request success`, {requestId:reqId});
    return json;
  }catch(firstErr){
    if(firstErr.kind === 'network'){
      safeDebug(`[search] retrying after transient failure`, {requestId:reqId});
      await new Promise(r=>setTimeout(r, 700));
      try{
        const json = await fetchBackendJson(url, body, timeoutMs);
        safeDebug(`[search] request success after retry`, {requestId:reqId});
        return json;
      }catch(secondErr){
        secondErr.kind = secondErr.kind || 'network';
        safeDebug(`[search] request failed after retry`, {requestId:reqId, errorType:secondErr.kind, status:secondErr.status});
        throw secondErr;
      }
    }
    safeDebug(`[search] request failed (no retry -- kind=${firstErr.kind})`, {requestId:reqId, errorType:firstErr.kind, status:firstErr.status});
    throw firstErr;
  }
}

// Single error -> message mapping for the search backend, using exactly the states this
// app is required to distinguish: SEARCHING / SUCCESS / NO_RESULTS are handled at the
// call sites; this covers NETWORK_ERROR / SEARCH_PROVIDER_UNAVAILABLE / INTERNAL_ERROR.
// Never mentions Claude/Waypoint in any user-facing text.
function classifyBackendError(e){
  safeError('Search error:', e && e.kind, e && e.status, e && e.message);
  if(e && e.kind === 'provider'){
    return {
      kind:'SEARCH_PROVIDER_UNAVAILABLE',
      title:'Search service temporarily unavailable',
      body:'The search backend reported a problem reaching its search provider. This is usually temporary -- you can retry, or add the place manually using a source you already have.',
      retryLabel:'Retry Later'
    };
  }
  if(e && e.kind === 'parse'){
    return {
      kind:'INTERNAL_ERROR',
      title:'Search service encountered an application error',
      body:'The search completed but its response couldn\'t be read. Try again, or add the place manually using a source you already have.',
      retryLabel:'Retry Search'
    };
  }
  return {
    kind:'NETWORK_ERROR',
    title:'Verified search temporarily unavailable',
    body:'The search request couldn\'t reach the server -- this is usually a temporary connectivity issue. You can retry, or add the place manually using a source you already have.',
    retryLabel:'Retry Search'
  };
}

// Stage 1 -- Place Discovery: loose, tokenized, alias-tolerant search for real candidate
// places or destination areas/islands. All flexible-search behavior (partial words, multi-
// word, punctuation tolerance) is delegated to the underlying search engines via SearXNG --
// this function just builds context, calls the backend, and normalizes the response.
async function discoverPlaces(query, countryName, region, island, city, typeHint){
  const json = await callBackend(SEARCH_BACKEND_URL, {
    query, country: countryName, region: region||'', city: city||'', area: island||'', type: 'place', typeHint: typeHint||''
  }, 15000, `place:${query}`);
  if(!json || json.success !== true) {
    const e = new Error(json && json.message || 'Search unsuccessful');
    e.kind = (json && json.errorType==='SEARCH_PROVIDER_UNAVAILABLE') ? 'provider' : 'parse';
    throw e;
  }
  return (json.results||[]).map(r=>({
    name: r.name, type: r.category||typeHint||'Place', address: r.address||null,
    city: r.city||city||null, region: r.region||region||null, island: island||null,
    website: r.website||r.sourceUrl||null, sourceName: r.sourceName||null, sourceUrl: r.sourceUrl||r.website||null,
    sourceType: r.sourceType||'search_result'
  }));
}

// Stage 2 -- Information / Price Verification: a targeted follow-up search for ticket/menu/
// admission pricing for one specific, already-identified place. IMPORTANT: without an LLM
// reading and confirming page content, a raw search result (title + snippet) is never treated
// as a verified price by itself -- per spec, "a generic place result is insufficient for a
// verified price." So this returns candidate SOURCES (with a lightweight, clearly-labeled
// heuristic flag when a price-looking substring appears in the snippet) for the person to
// review and confirm through "Add manually with a source I have" -- it does not auto-add
// priced items the way the old Claude-based extraction did.
const PRICE_MENTION_RE = /(?:[$\u20ac\u00a3\u00a5\u20b9\u20a9\u20ba\u20bd\u20b4\u20ab\u0e3f\u20a6]\s?\d[\d.,]*|\d[\d.,]*\s?(?:USD|EUR|GBP|JPY|CHF|CAD|AUD|THB|kr|z\u0142|K\u010d|Ft))/i;
async function discoverPricing(placeName, countryName, region, island, city, typeHint){
  const query = `${placeName} tickets price`;
  const json = await callBackend(SEARCH_BACKEND_URL, {
    query, country: countryName, region: region||'', city: city||'', area: island||'', type: 'pricing', typeHint: typeHint||''
  }, 15000, `pricing:${placeName}`);
  if(!json || json.success !== true){
    const e = new Error(json && json.message || 'Search unsuccessful');
    e.kind = (json && json.errorType==='SEARCH_PROVIDER_UNAVAILABLE') ? 'provider' : 'parse';
    throw e;
  }
  return (json.results||[]).map(r=>{
    const haystack = `${r.name||''} ${r.snippet||''}`;
    const m = haystack.match(PRICE_MENTION_RE);
    return {
      title: r.name, snippet: r.snippet||'', sourceUrl: r.sourceUrl||r.website||null,
      sourceName: r.sourceName || (r.sourceUrl ? (()=>{ try{return new URL(r.sourceUrl).hostname.replace(/^www\./,'');}catch(e){return r.sourceUrl;} })() : 'Search result'),
      sourceType: r.sourceType||'search_result',
      possiblePriceMention: m ? m[0] : null
    };
  });
}

/* ============================= EXCHANGE RATE ENGINE =============================
   Generic, currency-pair-agnostic conversion via a single publicly-published ECB
   reference-rate feed (proxied server-side by FX_BACKEND_URL -- see netlify/functions/
   fxrate.js). Fetches at most one "1 EUR = X CCY" rate per currency actually used in
   the trip and bridges any FROM->TO conversion through EUR:
     1 FROM = (1 / eurRate(FROM)) EUR = (eurRate(TO) / eurRate(FROM)) TO
   This handles inverses and cross-rates the feed never quotes directly (e.g. THB->CAD)
   uniformly, and each currency's rate is cached and reused for the whole session. */
async function getEurRate(ccy){
  if(ccy === 'EUR') return {ccy:'EUR', rate:1, date: fmtDate(TODAY), sourceName:'Same currency', sourceUrl:''};
  const cached = state.eurRateCache[ccy];
  if(cached){
    // Already fetched once this session -- reuse it rather than hitting the backend again.
    return {...cached, fromCache:true};
  }
  try{
    const json = await callBackend(FX_BACKEND_URL, {ccy}, 12000, `eurRate:${ccy}`);
    if(!json || json.success !== true || typeof json.rate !== 'number' || json.rate <= 0){
      return null; // parsed but unusable, and nothing cached to fall back on
    }
    const rec = { ccy, rate: json.rate, date: json.date, sourceName: json.sourceName || 'European Central Bank', sourceUrl: json.sourceUrl || '', fromCache:false };
    state.eurRateCache[ccy] = rec;
    return rec;
  }catch(e){
    // Nothing cached (checked above) -- a provider/network failure genuinely means no rate.
    e.eurRateFailed = true;
    throw e;
  }
}

async function convertAmount(amount, fromCcy, toCcy){
  if(fromCcy === toCcy) return {amount, rate:1, sameCurrency:true};
  const [fromEur, toEur] = await Promise.all([getEurRate(fromCcy), getEurRate(toCcy)]);
  if(!fromEur || !toEur) return null;
  const rate = toEur.rate / fromEur.rate; // 1 FROM = rate TO, bridged through EUR
  return { amount: amount*rate, rate, fromEur, toEur };
}

/* ============================= CALC HELPERS ============================= */
function itemSubtotal(item){
  const q = item.qty||1;
  if(item.priceType==="range"){
    return { min: (item.minPrice||0)*q, max: (item.maxPrice||0)*q, isRange:true };
  }
  return { min: (item.price||0)*q, max:(item.price||0)*q, isRange:false };
}
function placeTotals(place){
  let min=0,max=0,hasRange=false, byCat={};
  place.items.forEach(it=>{
    const s = itemSubtotal(it);
    min+=s.min; max+=s.max; if(s.isRange) hasRange=true;
    byCat[it.category] = byCat[it.category] || {min:0,max:0};
    byCat[it.category].min += s.min; byCat[it.category].max += s.max;
  });
  return {min,max,hasRange,byCat};
}
function countryTotals(country){
  let min=0,max=0,hasRange=false, byCat={};
  country.places.forEach(p=>{
    const t = placeTotals(p);
    min+=t.min; max+=t.max; if(t.hasRange) hasRange=true;
    Object.keys(t.byCat).forEach(cat=>{
      byCat[cat] = byCat[cat]||{min:0,max:0};
      byCat[cat].min += t.byCat[cat].min; byCat[cat].max += t.byCat[cat].max;
    });
  });
  return {min,max,hasRange,byCat};
}
function allItemsFlat(){
  const out=[];
  state.countries.forEach(c=>c.places.forEach(p=>p.items.forEach(it=>out.push({country:c,place:p,item:it}))));
  return out;
}

/* ============================= RENDER SHELL ============================= */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderHeader()}
    ${renderTabs()}
    <div class="view">${renderActiveView()}</div>
  `;
  wireHeader();
  wireTabs();
  wireActiveView();
}

function renderHeader(){
  const countryOpts = COUNTRIES.map(c=>`<option value="${c.iso2}" ${state.homeCountry===c.iso2?'selected':''}>${c.name}</option>`).join('');
  const ccyOpts = CURRENCIES.map(c=>`<option value="${c.code}" ${state.homeCurrency===c.code?'selected':''}>${c.code} — ${c.name}</option>`).join('');
  return `
  <div class="header">
    <div class="brandrow">
      <div class="brand"><h1>Waypoint</h1><span class="tag">Travel Cost Calculator</span></div>
      <div class="homebar">
        <label>Home Country</label>
        <select id="homeCountrySel"><option value="">Select…</option>${countryOpts}</select>
        <label>Home Currency</label>
        <select id="homeCurrencySel"><option value="">Select…</option>${ccyOpts}</select>
      </div>
    </div>
  </div>`;
}
function wireHeader(){
  on('homeCountrySel','change', e=>{
    state.homeCountry = e.target.value || null;
    const base = COUNTRIES.find(c=>c.iso2===state.homeCountry);
    if(base && !state.homeCurrency) state.homeCurrency = base.currency;
    render();
  });
  on('homeCurrencySel','change', e=>{
    state.homeCurrency = e.target.value || null;
    render();
  });
}

function renderTabs(){
  const totalPlaces = state.countries.reduce((a,c)=>a+c.places.length,0);
  const totalItems = allItemsFlat().length;
  const tabs = [
    ['trip','Trip Setup'],
    ['destinations','Destinations & Places', totalPlaces],
    ['selections','My Selections', totalItems],
    ['money','Money Needed'],
    ['sources','Sources', totalItems],
    ['qa','QA / Diagnostics']
  ];
  return `<div class="tabs">${tabs.map(t=>`
    <div class="tab ${state.activeTab===t[0]?'active':''}" data-tab="${t[0]}">${t[1]}${t[2]?`<span class="n">${t[2]}</span>`:''}</div>
  `).join('')}</div>`;
}
function wireTabs(){
  document.querySelectorAll('.tab').forEach(el=>{
    el.onclick = ()=>{ state.activeTab = el.dataset.tab; render(); };
  });
}

function renderActiveView(){
  if(!state.homeCountry || !state.homeCurrency){
    if(state.activeTab!=='trip' && state.activeTab!=='qa'){
      return `<div class="empty"><h3>Set your home country & currency first</h3><p>Use the fields in the top bar, then head to the Trip Setup tab.</p></div>`;
    }
  }
  switch(state.activeTab){
    case 'trip': return renderTrip();
    case 'destinations': return renderDestinations();
    case 'selections': return renderSelections();
    case 'money': return renderMoney();
    case 'sources': return renderSources();
    case 'qa': return renderQA();
    default: return '';
  }
}
function wireActiveView(){
  switch(state.activeTab){
    case 'trip': wireTrip(); break;
    case 'destinations': wireDestinations(); break;

}

function renderPlaceCard(country, place){
  const t = placeTotals(place);
  const totalStr = t.hasRange ? `${money(t.min,place.currency)} – ${money(t.max,place.currency)}` : money(t.min, place.currency);
  const stale = daysSince(place.verifiedDate) > 30;
  return `
  <div class="place-item">
    <div class="rowtop">
      <div>
        <strong>${place.name}</strong> <span class="pill" style="margin-left:6px;">${place.type}</span>
        <div class="item-meta">${[place.city,place.island,place.region,country.name].filter(Boolean).join(' · ')}</div>
        <div style="margin-top:6px;">
          ${sourcePill(place.sourceQuality)}${place.enteredManually?'<span class="pill manual" style="margin-left:4px;">User supplied</span>':''}
          ${place.sourceUrl ? `<a class="srclink" href="${place.sourceUrl}" target="_blank" rel="noopener">${place.sourceName||'Source'}</a>` : `<span class="note">${place.sourceName||'No source link'}</span>`}
          <span class="note"> · verified ${place.verifiedDate}</span>
          ${stale?`<span class="pill stale" style="margin-left:6px;">Price may have changed</span>`:''}
        </div>
      </div>
      <div style="text-align:right;">
        <div class="mono" style="font-weight:600;">${totalStr}</div>
        <button class="btn ghost sm" data-rmplace="${place.id}" style="margin-top:8px;">Remove place</button>
      </div>
    </div>
    ${place.items.length? place.items.map(it=>renderItemRow(country,place,it)).join('') : `<div class="note" style="margin-top:8px;">No priced items added yet.</div>`}
  </div>`;
}
function sourcePill(q){
  if(q==='Official') return `<span class="pill official">Official</span>`;
  if(q==='Officially Sourced' || q==='Official Tourism') return `<span class="pill tourism">Officially Sourced</span>`;
  if(q==='Manual') return `<span class="pill manual">User-supplied</span>`;
  return `<span class="pill secondary">Verified Secondary</span>`;
}
function renderItemRow(country, place, it){
  const s = itemSubtotal(it);
  const subStr = it.priceType==='range' ? `${money(s.min,it.currency)} – ${money(s.max,it.currency)}` : money(s.min,it.currency);
  const priceStr = it.priceType==='range' ? `${money(it.minPrice,it.currency)}–${money(it.maxPrice,it.currency)}` : money(it.price,it.currency);
  return `
  <div class="item-row">
    <div>
      <div>${it.name} <span class="note" style="text-transform:capitalize;">(${it.category})</span></div>
      <div class="item-meta">${priceStr} × <input type="number" min="1" class="qty-input mono" value="${it.qty}" data-qty="${place.id}|${it.id}"> = <span class="mono">${subStr}</span></div>
    </div>
    <button class="btn ghost sm" data-rmitem="${place.id}|${it.id}">Remove</button>
  </div>`;
}

function wireDestinations(){
  document.querySelectorAll('[data-country]').forEach(el=>{
    el.onclick=()=>{ uiDestCountry = el.dataset.country; render(); };
  });
  document.querySelectorAll('[data-rmplace]').forEach(el=>{
    el.onclick=()=>{
      const c = findCountry(uiDestCountry);
      c.places = c.places.filter(p=>p.id!==el.dataset.rmplace);
      render();
    };
  });
  document.querySelectorAll('[data-rmitem]').forEach(el=>{
    el.onclick=()=>{
      const [pid,iid] = el.dataset.rmitem.split('|');
      const c = findCountry(uiDestCountry);
      const p = c.places.find(x=>x.id===pid);
      p.items = p.items.filter(i=>i.id!==iid);
      render();
    };
  });
  document.querySelectorAll('[data-qty]').forEach(el=>{
    el.onchange=()=>{
      const [pid,iid] = el.dataset.qty.split('|');
      const c = findCountry(uiDestCountry);
      const p = c.places.find(x=>x.id===pid);
      const it = p.items.find(i=>i.id===iid);
      it.qty = Math.max(1, parseInt(el.value)||1);
      render();
    };
  });

  // These controls only exist once at least one country has been added (see renderDestinations'
  // empty state) — guard every lookup so a null element never throws.
  on('manualAddBtn','click', ()=>renderManualForm());
  on('searchPlaceBtn','click', ()=>runDetailedSearch());
  on('browseMatchesBtn','click', ()=>runCandidateSearch());
}

function currentDestFormValues(){
  return {
    name: document.getElementById('placeNameInput').value.trim(),
    type: document.getElementById('placeTypeInput').value,
    city: document.getElementById('cityInput').value.trim(),

  };

let lastDetailedSearchArgs = null;
let lastCandidateSearchArgs = null;

function renderSearchErrorCard(errInfo){
  return `<div class="warn-banner">
    <strong>${errInfo.title}.</strong> ${errInfo.body}
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">

      <button class="btn ghost sm" id="goManualBtn">Add Manually</button>
    </div>

function wireUnavailableCard(retryFn, prefill){
  const retryBtn = document.getElementById('retrySearchBtn');
  const manualBtn = document.getElementById('goManualBtn');
  if(retryBtn) retryBtn.onclick = retryFn;
  if(manualBtn) manualBtn.onclick = ()=>renderManualForm(prefill);
}
function cachedBadge(){
  return `<span class="pill secondary" style="margin-left:6px;">Cached result — previously searched this session</span>`;
}

// STAGE 1 — Place Discovery. Loose, tokenized, partial/alias-tolerant search for real
// places or destination areas/islands, via the SearXNG-backed search endpoint (no Claude).
async function runCandidateSearch(){
  const f = currentDestFormValues();
  if(!f.name){ alert('Type a name or a few search words first — it can be partial, e.g. "natural history" or "comic con".'); return; }
  lastCandidateSearchArgs = f;
  const country = findCountry(uiDestCountry);
  const statusEl = document.getElementById('searchStatus');
  const candEl = document.getElementById('candidateResults');
  document.getElementById('searchResultCard').innerHTML = '';
  candEl.innerHTML = '';

  const cacheKey = searchCacheKey(country.iso2, f.name, f.type, f.city, f.region, f.island);
  const cached = state.candidateCache[cacheKey];
  let results, fromCache = false;
  if(cached){
    results = cached; fromCache = true;
    statusEl.innerHTML = '';
  } else {
    statusEl.innerHTML = `<div class="loading-line"><div class="spinner"></div> Searching verified sources…</div>`;
    try{
      results = await discoverPlaces(f.name, country.name, f.region, f.island, f.city, f.type);
      statusEl.innerHTML = '';
    }catch(e){
      statusEl.innerHTML = '';
      const errInfo = classifyBackendError(e);
      candEl.innerHTML = renderSearchErrorCard(errInfo);
      wireUnavailableCard(()=>runCandidateSearch(), {name:f.name});
      return;
    }
  }

  if(!results || !results.length){
    candEl.innerHTML = `<div class="warn-banner"><strong>No matching verified information found.</strong> Nothing turned up for "${f.name}" in ${country.name}. Try different search terms, or add it manually.</div>`;
    return;
  }
  if(!fromCache) state.candidateCache[cacheKey] = results;
  statusEl.innerHTML = `<div class="note">Verified search completed${fromCache?' (from cached result)':''}.</div>`;
  candEl.innerHTML = `
    <div class="card" style="background:var(--paper-dim);margin-top:14px;">
      <div class="note" style="margin-bottom:10px;">Matches for "${f.name}" — best matches first.${fromCache?cachedBadge():''} Search results can't automatically tell a specific place apart from a general destination area — pick whichever action fits what you found.</div>
      ${results.map((r,idx)=>`
        <div class="item-row">
          <div>
            <div><strong>${r.name}</strong>${r.type?` <span class="pill" style="margin-left:4px;">${r.type}</span>`:''}</div>
            <div class="item-meta">${[r.city,r.island,r.region,r.address].filter(Boolean).join(' · ')}</div>
            ${r.sourceUrl?`<div class="item-meta"><a class="srclink" href="${r.sourceUrl}" target="_blank" rel="noopener">${r.sourceName||r.sourceUrl}</a></div>`:''}
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
            <button class="btn brass sm" data-cand-price="${idx}">Search pricing for this</button>
            <button class="btn ghost sm" data-cand-area="${idx}">Use as island/area</button>
          </div>
        </div>
      `).join('')}
    </div>`;
  document.querySelectorAll('[data-cand-area]').forEach(el=>{
    el.onclick = ()=>{
      const r = results[parseInt(el.dataset.candArea)];
      document.getElementById('islandInput').value = r.name;
      if(r.region) document.getElementById('regionInput').value = r.region;
      document.getElementById('placeNameInput').value = '';
      document.getElementById('candidateResults').innerHTML = `<div class="note" style="margin-top:10px;">Island/Area set to "${r.name}". Now type a place — e.g. "museum" or "beach taverna" — and search again.</div>`;
    };
  });
  document.querySelectorAll('[data-cand-price]').forEach(el=>{
    el.onclick = ()=>{
      const r = results[parseInt(el.dataset.candPrice)];
      if(r.city) document.getElementById('cityInput').value = r.city;
      if(r.region) document.getElementById('regionInput').value = r.region;
      document.getElementById('placeNameInput').value = r.name;
      runDetailedSearch(r.name, r.type);
    };
  });
}

// STAGE 2 — Information / Price Verification. A targeted follow-up search for ticket/menu/
// admission pricing sources for one already-identified place. A raw search result never
// becomes an auto-added "verified price" here (no LLM is reading the pages) — every source
// found funnels into "Add manually with a source I have", prefilled with the name/link/date,
// so a person confirms the actual number against the real page before it enters the trip.
async function runDetailedSearch(nameOverride, typeOverride){
  const f = currentDestFormValues();
  const name = nameOverride!==undefined ? nameOverride : f.name;
  const type = typeOverride!==undefined ? typeOverride : f.type;
  const country = findCountry(uiDestCountry);
  if(!name){ alert('Enter a place name or search terms first.'); return; }
  lastDetailedSearchArgs = {name, type, city:f.city, region:f.region, island:f.island};
  const statusEl = document.getElementById('searchStatus');
  const resultEl = document.getElementById('searchResultCard');
  document.getElementById('candidateResults').innerHTML = '';
  resultEl.innerHTML = '';

  const cacheKey = searchCacheKey(country.iso2, name, type, f.city, f.region, f.island);
  const cached = state.searchCache[cacheKey];
  let results, fromCache = false;
  if(cached){
    results = cached; fromCache = true;
    statusEl.innerHTML = '';
  } else {
    statusEl.innerHTML = `<div class="loading-line"><div class="spinner"></div> Searching verified sources…</div>`;
    try{
      results = await discoverPricing(name, country.name, f.region, f.island, f.city, type);
      statusEl.innerHTML = '';
    }catch(e){
      statusEl.innerHTML = '';
      const errInfo = classifyBackendError(e);
      resultEl.innerHTML = renderSearchErrorCard(errInfo);
      wireUnavailableCard(()=>runDetailedSearch(lastDetailedSearchArgs.name, lastDetailedSearchArgs.type), {name});
      return;
    }
  }

  if(!results || !results.length){
    resultEl.innerHTML = `<div class="warn-banner"><strong>No matching verified information found.</strong> Nothing pricing-related turned up for "${name}". Try "Browse matches" for a different place name, or add it manually if you already have a source.</div>`;
    return;
  }
  if(!fromCache) state.searchCache[cacheKey] = results;
  statusEl.innerHTML = `<div class="note">Verified search completed${fromCache?' (from cached result)':''}. Review a source below and confirm its price to add it — a search result alone is never treated as a verified price.</div>`;
  resultEl.innerHTML = renderSearchResult(results, name, type, f.city, f.region, f.island, fromCache);
  wireSearchResult(results, name, type, f.city, f.island);
}

function renderSearchResult(results, name, type, city, region, island, fromCache){
  return `
  <div class="card" style="background:var(--paper-dim);margin-top:14px;">
    <div class="note" style="margin-bottom:10px;"><strong>${name}</strong>${type?` <span class="pill">${type}</span>`:''}${fromCache?cachedBadge():''} — pricing-related sources found:</div>
    ${results.map((r,idx)=>`
      <div class="item-row">
        <div>
          <div>${r.title||r.sourceName}${r.possiblePriceMention?` <span class="pill secondary">possible price mentioned: ${r.possiblePriceMention}</span>`:''}</div>
          ${r.snippet?`<div class="item-meta">${r.snippet}</div>`:''}
          <div class="item-meta"><a class="srclink" href="${r.sourceUrl}" target="_blank" rel="noopener">${r.sourceName||r.sourceUrl}</a></div>
        </div>
        <button class="btn brass sm" data-src="${idx}">Add with this source</button>
      </div>
    `).join('')}
  </div>`;
}
function wireSearchResult(results, name, type, city, island){
  document.querySelectorAll('[data-src]').forEach(el=>{
    el.onclick = ()=>{
      const r = results[parseInt(el.dataset.src)];
      renderManualForm({
        name, type, city, island,
        sourceName: r.sourceName, sourceUrl: r.sourceUrl,
        hint: r.possiblePriceMention ? `The search snippet mentioned "${r.possiblePriceMention}" — verify this on the source page before entering a price; it's a rough text match, not a confirmed price.` : ''
      });
    };
  });
}

    const url = document.getElementById('mUrl').value.trim();
    const date = document.getElementById('mDate').value;
    if(!pname || !iname || !url || !date){ alert('Place name, item name, source URL and date are required.'); return; }
    const ptype = document.getElementById('mPlaceType').value || 'Place';
    const cityVal = document.getElementById('mCity').value.trim();
    const islandVal = document.getElementById('mIsland').value.trim();
    const srcName = document.getElementById('mSourceName').value.trim() || 'User supplied source';
    const srcType = document.getElementById('mSourceType').value;
    let place = country.places.find(p=>p.name===pname && p.city===cityVal && p.island===islandVal);
    if(!place){
      place = {id:uid(), name:pname, type:ptype, city:cityVal, region:'', island:islandVal,
        currency: document.getElementById('mCurrency').value, sourceName:srcName, sourceUrl:url,
        sourceQuality:srcType, verifiedDate:date, enteredManually:true, items:[]};
      country.places.push(place);
    }
    const priceType = document.getElementById('mPriceType').value;
    place.items.push({
      id:uid(), name:iname, category:document.getElementById('mCategory').value, priceType,
      price: priceType==='exact'? parseFloat(document.getElementById('mPrice').value)||0 : null,
      minPrice: priceType==='range'? parseFloat(document.getElementById('mMin').value)||0 : null,
      maxPrice: priceType==='range'? parseFloat(document.getElementById('mMax').value)||0 : null,
      currency: document.getElementById('mCurrency').value, qty:1,
      sourceName:srcName, sourceUrl:url, sourceQuality:srcType, verifiedDate:date, enteredManually:true,
      notes: document.getElementById('mNotes').value.trim()
    });
    el.style.display='none'; el.innerHTML='';
    render();
  };
}

let moneyResult = null; // {perCountry:[{iso2,min,max,rate,...}], grandMin, grandMax, hasRange, byCatHome, loading, error}

function renderMoney(){
  if(!allItemsFlat().length){
    return `<div class="empty"><h3>Nothing to total yet</h3><p>Add places and items first, then come back to calculate your final cost.</p></div>`;
  }
  return `
  <div class="section-title"><h2>Money Needed</h2></div>
  <div class="section-sub">Converts every country's local-currency subtotal into ${state.homeCurrency||'your home currency'} using a live, sourced exchange rate.</div>
  <button class="btn stamp" id="finalCostBtn" style="margin-bottom:20px;">FINAL COST</button>
  <div id="moneyOutput"></div>
  `;
}
function wireMoney(){
  const out = document.getElementById('moneyOutput');
  if(!out) return; // empty-state view has no Money Needed controls yet
  if(moneyResult) out.innerHTML = renderMoneyResult(moneyResult);
  on('finalCostBtn','click', async ()=>{
    if(!state.homeCurrency){ alert('Set a home currency first.'); return; }
    out.innerHTML = `<div class="loading-line"><div class="spinner"></div> Fetching current exchange rates and converting…</div>`;
    const per = [];
    const excluded = []; // {name, currency, errInfo} — ONLY populated when truly no rate (live or cached) exists
    let grandMin=0, grandMax=0, hasRange=false;
    const byCatHome = {};
    for(const c of state.countries){
      if(!c.places.length) continue;
      const t = countryTotals(c);
      let conv = null, convErr = null;
      try{
        conv = await convertAmount(1, c.currency, state.homeCurrency);
      }catch(e){ convErr = e; }
      if(!conv){
        // Only exclude when there is genuinely no usable rate — not merely because this
        // particular request failed if we already have a cached rate to fall back on.
        excluded.push({name:c.name, currency:c.currency, errInfo: convErr ? classifyBackendError(convErr) : null});
        continue;
      }
      const min = t.min*conv.rate, max = t.max*conv.rate;
      grandMin+=min; grandMax+=max; if(t.hasRange) hasRange=true;
      Object.keys(t.byCat).forEach(cat=>{
        byCatHome[cat] = byCatHome[cat]||{min:0,max:0};
        byCatHome[cat].min += t.byCat[cat].min*conv.rate;
        byCatHome[cat].max += t.byCat[cat].max*conv.rate;
      });
      per.push({iso2:c.iso2, name:c.name, currency:c.currency, localMin:t.min, localMax:t.max, hasRange:t.hasRange, conv, homeMin:min, homeMax:max});
    }
    moneyResult = {per, grandMin, grandMax, hasRange, byCatHome, excluded};
    out.innerHTML = renderMoneyResult(moneyResult);
  });
}
function renderMoneyResult(r){
  const totalStr = r.hasRange ? `${money(r.grandMin,state.homeCurrency)} – ${money(r.grandMax,state.homeCurrency)}` : money(r.grandMin,state.homeCurrency);
  const catLabels = {ticket:'Tickets',food:'Food & Drinks',drink:'Food & Drinks',souvenir:'Souvenirs',merchandise:'Souvenirs / Merchandise',activity:'Activities',other:'Other Purchases'};
  const merged = {};
  Object.keys(r.byCatHome||{}).forEach(cat=>{
    const label = catLabels[cat]||'Other Purchases';
    merged[label] = merged[label]||{min:0,max:0};
    merged[label].min += r.byCatHome[cat].min; merged[label].max += r.byCatHome[cat].max;
  });
  function legNote(leg){
    // leg is a getEurRate() result: {rate, date, sourceName, sourceUrl, fromCache, staleFallback}
    if(leg.sameCurrency || leg.sourceName==='Same currency') return '';
    const cachedTag = leg.fromCache ? ` <span class="pill secondary" style="margin-left:4px;">Using latest verified cached rate</span>` : '';
    const src = leg.sourceUrl ? `<a class="srclink" href="${leg.sourceUrl}" target="_blank" rel="noopener">${leg.sourceName}</a>` : (leg.sourceName||'—');
    return `<div class="note">1 EUR = ${leg.rate.toFixed(4)} ${leg.ccy} · ${src} · ref. ${leg.date}${cachedTag}</div>`;
  }
  return `
    ${(r.excluded||[]).map(x=>{
      if(x.errInfo){
        return `<div class="warn-banner"><strong>${x.errInfo.title}.</strong> ${x.name}'s total (${x.currency}) could not be converted — ${x.errInfo.body} It is excluded from the total below until a rate can be verified.</div>`;
      }
      return `<div class="warn-banner"><strong>No verified exchange rate found for ${x.currency}.</strong> ${x.name}'s total is excluded from the grand total until a rate can be verified — try again.</div>`;
    }).join('')}
    <div class="boardingpass">
      <div class="bp-punch top"></div><div class="bp-punch bot"></div>
      <div class="bp-main">
        <div class="lbl">Money Needed · ${state.homeCurrency}</div>
        <div class="${r.hasRange?'bp-range':'bp-total'}">${totalStr}</div>
        <div class="bp-sub">${r.hasRange? 'Estimated Cost Range — some selected items are priced as ranges by their sources.' : 'Exact Estimated Total — every selected item has a single verified price.'}</div>
      </div>
      <div class="bp-stub">
        <div class="lbl">Countries</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;margin-top:8px;line-height:1.9;">
          ${r.per.map(p=>`${p.name}`).join('<br>')}
        </div>
      </div>
    </div>

    <div class="cat-total-grid">
      ${Object.keys(merged).map(label=>{
        const m = merged[label];
        const str = (m.max-m.min>0.005) ? `${money(m.min,state.homeCurrency)}–${money(m.max,state.homeCurrency)}` : money(m.min,state.homeCurrency);
        return `<div class="cat-total"><div class="lbl">${label}</div><div class="amt">${str}</div></div>`;
      }).join('')}
    </div>

    <h3 style="font-size:15px;margin:24px 0 10px;">Country breakdown</h3>
    <table class="srctable">
      <tr><th>Country</th><th>Local subtotal</th><th>Effective rate</th><th>In ${state.homeCurrency}</th><th>Reference rates used (via EUR)</th></tr>
      ${r.per.map(p=>`
        <tr>
          <td>${p.name}</td>
          <td class="mono">${p.hasRange? money(p.localMin,p.currency)+'–'+money(p.localMax,p.currency) : money(p.localMin,p.currency)}</td>
          <td class="mono">1 ${p.currency} = ${p.conv.rate.toFixed(4)} ${state.homeCurrency}</td>
          <td class="mono">${(p.homeMax-p.homeMin>0.01)? money(p.homeMin,state.homeCurrency)+'–'+money(p.homeMax,state.homeCurrency) : money(p.homeMin,state.homeCurrency)}</td>
          <td>${p.conv.sameCurrency ? '<span class="note">Same currency — no conversion needed</span>' : legNote(p.conv.fromEur)+legNote(p.conv.toEur)}</td>
        </tr>
      `).join('')}
    </table>
    <div class="note" style="margin-top:10px;">Estimated currency conversion, bridged through EUR reference rates — the actual rate your bank or card issuer applies may differ.</div>
  `;
}

/* ============================= TAB: QA / DIAGNOSTICS =============================
   Self-contained test harness per the audit's "Self-Test / QA Mode" requirement.
   - Logic tests (calculation, ranges, multi-country) run instantly, no network at all.
   - Error-state and currency-engine tests run against a temporarily-mocked fetch, so
     rate-limit / network-failure / cached-fallback paths are exercised deterministically
     without spending real search quota and without needing to actually trip a live 429.
   - Live search tests are opt-in per query (clearly marked as using real quota) because
     auto-running them would itself risk causing the very rate-limit this app has to handle,
     and because unprompted background requests would violate the "no background polling" rule.
   All of it runs against an isolated test-only state object, never the user's real trip data. */
let qaResults = null;

function qaMakeIsolatedState(){
  return { homeCountry:null, homeCurrency:null, countries:[], eurRateCache:{}, searchCache:{}, candidateCache:{}, activeTab:'qa' };
}
async function qaWithIsolatedState(fn){
  const real = state;
  state = qaMakeIsolatedState();
  try{ return await fn(); }
  finally{ state = real; }
}
async function qaWithMockFetch(mockFn, fn){
  const realFetch = window.fetch;
  window.fetch = mockFn;
  try{ return await fn(); }
  finally{ window.fetch = realFetch; }
}
function qaMockBackendJson(payloadObj){
  return { ok:true, status:200, json: async ()=>payloadObj };
}
function qaMockBackendError(status, bodyObj){
  return { ok:false, status, json: async ()=> (bodyObj||{}) };
}

function runQaCalcTests(){
  const results = [];
  function check(name, actual, expected, tol){
    tol = tol===undefined ? 0.005 : tol;
    const pass = Math.abs(actual-expected) <= tol;
    results.push({name, pass, detail:`got ${actual}, expected ${expected}`});
  }
  // Ticket €10x3, Food €12x2, Souvenir €8x4, Activity €25x2 -> total €136
  const items = [
    {priceType:'exact', price:10, qty:3, category:'ticket'},
    {priceType:'exact', price:12, qty:2, category:'food'},
    {priceType:'exact', price:8,  qty:4, category:'souvenir'},
    {priceType:'exact', price:25, qty:2, category:'activity'},
  ];
  const total = items.reduce((sum,it)=>sum+itemSubtotal(it).min, 0);
  check('Ticket €10×3 + Food €12×2 + Souvenir €8×4 + Activity €25×2 = €136', total, 136);

  // Range €20–€100 × 2 = €40–€200
  const r = itemSubtotal({priceType:'range', minPrice:20, maxPrice:100, qty:2});
  check('Range €20–€100 × qty 2 → min', r.min, 40);
  check('Range €20–€100 × qty 2 → max', r.max, 200);

  // Multi-country: two independent country totals, each computed only from its own places
  const countryA = {places:[{items:[{priceType:'exact',price:50,qty:1,category:'ticket'}]}]};
  const countryB = {places:[{items:[{priceType:'exact',price:30,qty:2,category:'food'}]}]};
  const totA = countryTotals(countryA), totB = countryTotals(countryB);
  check('Country A subtotal computed independently (50)', totA.min, 50);
  check('Country B subtotal computed independently (60)', totB.min, 60);
  results.push({name:'Country A total unaffected by Country B data', pass: totA.min===50 && totB.min===60, detail:`A=${totA.min}, B=${totB.min}`});

  return results;
}

async function runQaErrorStateTests(){
  const results = [];

  // NO CLAUDE CALL: verify a place search never touches api.anthropic.com at all.
  await qaWithIsolatedState(async ()=>{
    let hitAnthropic = false, hitBackend = false;
    await qaWithMockFetch(async (url)=>{
      if(String(url).includes('anthropic.com')) hitAnthropic = true;
      if(String(url).includes(SEARCH_BACKEND_URL)) hitBackend = true;
      return qaMockBackendJson({success:true, results:[{name:'Test Place', category:'Museum', city:'Testville', sourceUrl:'https://example.gov/test', sourceName:'example.gov'}]});
    }, async ()=>{ await discoverPlaces('test query', 'Testland', '', '', '', ''); });
    results.push({name:'Place search calls the search backend, never api.anthropic.com', pass: hitBackend && !hitAnthropic, detail:`backend hit=${hitBackend}, anthropic hit=${hitAnthropic}`});
  });

  // SEARCH_PROVIDER_UNAVAILABLE: backend reports its own upstream (SearXNG) failure — must NOT retry, must classify distinctly
  await (async ()=>{
    let calls = 0;
    const start = Date.now();
    let caught = null;
    await qaWithMockFetch(async ()=>{ calls++; return qaMockBackendError(502, {success:false, errorType:'SEARCH_PROVIDER_UNAVAILABLE', message:'SearXNG upstream unavailable'}); },
      async ()=>{ try{ await callBackend(SEARCH_BACKEND_URL, {query:'x'}, 5000, 'qa-provider'); }catch(e){ caught=e; } });
    const elapsed = Date.now()-start;
    const info = caught ? classifyBackendError(caught) : null;
    results.push({name:'Backend-reported provider failure classifies as SEARCH_PROVIDER_UNAVAILABLE', pass: !!info && info.kind==='SEARCH_PROVIDER_UNAVAILABLE', detail: info&&info.kind});
    results.push({name:'Provider failure (502) does not incur the retry backoff (single attempt)', pass: calls===1 && elapsed<400, detail:`calls=${calls}, elapsed=${elapsed}ms`});
  })();

  // NETWORK_ERROR: a thrown fetch (offline/DNS/unreachable) must retry once, then classify as NETWORK_ERROR
  await (async ()=>{
    let calls = 0;
    let caught = null;
    await qaWithMockFetch(async ()=>{ calls++; throw new Error('simulated offline failure'); },
      async ()=>{ try{ await callBackend(SEARCH_BACKEND_URL, {query:'x'}, 5000, 'qa-network'); }catch(e){ caught=e; } });
    const info = caught ? classifyBackendError(caught) : null;
    results.push({name:'Genuine network failure retries exactly once (2 fetch calls)', pass: calls===2, detail:`fetch calls=${calls}`});
    results.push({name:'Network failure classifies as NETWORK_ERROR (generic "temporarily unavailable")', pass: !!info && info.kind==='NETWORK_ERROR' && /temporarily unavailable/i.test(info.title), detail: info&&info.title});
  })();

  // SUCCESS: a well-formed backend response is returned as-is
  await (async ()=>{
    let ok = false;
    await qaWithMockFetch(async ()=> qaMockBackendJson({success:true, results:[]}),
      async ()=>{ const json = await callBackend(SEARCH_BACKEND_URL, {query:'x'}, 5000, 'qa-success'); ok = json && json.success===true; });
    results.push({name:'SUCCESS: well-formed backend response is parsed', pass: ok});
  })();

  // NO_RESULTS: an empty results array must surface as a normal empty list, not a thrown error
  await qaWithIsolatedState(async ()=>{
    let res = null, threw = false;
    await qaWithMockFetch(async ()=> qaMockBackendJson({success:true, results:[]}),
      async ()=>{ try{ res = await discoverPlaces('a nonexistent place xyz', 'Testland', '', '', '', ''); }catch(e){ threw=true; } });
    results.push({name:'NO_RESULTS: empty result list surfaces as data, not a thrown error', pass: !threw && Array.isArray(res) && res.length===0, detail: JSON.stringify(res)});
  });

  // RETRY: retrying after a failure performs a brand-new request (no stale controller/signal reuse)
  await (async ()=>{
    let calls = 0;
    let firstErr = null, secondOk = false;
    await qaWithMockFetch(async ()=>{ calls++; return qaMockBackendError(502, {success:false, errorType:'SEARCH_PROVIDER_UNAVAILABLE'}); },
      async ()=>{ try{ await callBackend(SEARCH_BACKEND_URL, {query:'x'}, 5000, 'qa-retry-1'); }catch(e){ firstErr=e; } });
    await qaWithMockFetch(async ()=>{ calls++; return qaMockBackendJson({success:true, results:[]}); },
      async ()=>{ const json = await callBackend(SEARCH_BACKEND_URL, {query:'x'}, 5000, 'qa-retry-2'); secondOk = !!json; });
    results.push({name:'RETRY performs a genuinely new request after a prior failure', pass: !!firstErr && secondOk && calls===2, detail:`calls=${calls}`});
  })();

  // MANUAL_FALLBACK: manual entry path never touches the search pipeline at all
  results.push({name:'Manual entry is independent of the search pipeline (no network call involved)', pass: typeof renderManualForm === 'function'});

  return results;
}

async function runQaCurrencyTests(){
  const results = [];
  await qaWithIsolatedState(async ()=>{
    // SAME CURRENCY — must not touch the network at all
    let fetchCalled = false;
    await qaWithMockFetch(async ()=>{ fetchCalled=true; throw new Error('should not be called'); },
      async ()=>{
        const c = await convertAmount(100, 'EUR', 'EUR');
        results.push({name:'Same currency (EUR→EUR) needs no exchange-rate request', pass: !fetchCalled && c.amount===100 && c.sameCurrency===true, detail:`amount=${c.amount}`});
      });

    // Mocked ECB-style rate via the FX backend: 1 EUR = 1.1664 USD
    await qaWithMockFetch(async (url,opts)=>{
      const body = JSON.parse(opts.body);
      const rate = body.ccy==='USD' ? 1.1664 : 1;
      return qaMockBackendJson({success:true, rate, date:'2026-08-24', sourceName:'European Central Bank', sourceUrl:'https://ecb.europa.eu/x'});
    }, async ()=>{
      const eurToUsd = await convertAmount(100, 'EUR', 'USD');
      results.push({name:'EUR→USD: 100 EUR × 1.1664 = 116.64 USD', pass: Math.abs(eurToUsd.amount-116.64)<0.01, detail:eurToUsd.amount.toFixed(2)});

      const usdToEur = await convertAmount(100, 'USD', 'EUR');
      results.push({name:'USD→EUR via inversion: 100 / 1.1664 ≈ 85.73 EUR', pass: Math.abs(usdToEur.amount-85.73)<0.02, detail:usdToEur.amount.toFixed(2)});

      let calls2 = 0;
      const realFetch = window.fetch;
      window.fetch = async (...a)=>{ calls2++; return realFetch(...a); };
      await convertAmount(50, 'USD', 'EUR');
      window.fetch = realFetch;
      results.push({name:'CACHED RATE: repeat USD conversion reuses cache (0 new fetches)', pass: calls2===0, detail:`new fetch calls=${calls2}`});
    });

    // PROVIDER UNAVAILABLE with a cached rate already present -> must still succeed from cache
    await qaWithMockFetch(async ()=>{ throw new Error('provider down'); }, async ()=>{
      let ok=false, amt=0;
      try{ const r = await convertAmount(10, 'USD', 'EUR'); ok = r.fromEur.fromCache===true; amt=r.amount; }catch(e){ ok=false; }
      results.push({name:'Provider unavailable but a verified cached rate exists → conversion still succeeds', pass: ok, detail:`amount=${amt.toFixed ? amt.toFixed(2): amt}`});
    });

    // PREVIOUS WORKING DAY: a mocked response with an earlier reference date must be accepted as-is,
    // not rejected just because it isn't dated "today" — the app must never invent a fresher date.
    delete state.eurRateCache['GBP'];
    await qaWithMockFetch(async ()=> qaMockBackendJson({success:true, rate:0.86, date:'2026-08-21', sourceName:'European Central Bank (last published)', sourceUrl:'https://ecb.europa.eu/x'}),
      async ()=>{
        const r = await getEurRate('GBP');
        results.push({name:'Rate not yet published today → latest available working-day rate is used, with its real reference date shown', pass: !!r && r.date==='2026-08-21', detail:r&&r.date});
      });
  });
  return results;
}

function renderQA(){
  const calc = runQaCalcTests(); // instant, always shown
  return `
  <div class="section-title"><h2>QA / Diagnostics</h2></div>
  <div class="section-sub">Self-test harness for the calculation engine, error-state handling, and the search/currency backends. The calculation tests below run instantly with no network calls. The mocked tests simulate provider-unavailable / network-failure / cached-rate conditions against a temporary fake response, so they're deterministic and touch no real backend. The live tests at the bottom call your actual deployed backend endpoints (<span class="mono">${SEARCH_BACKEND_URL}</span> and <span class="mono">${FX_BACKEND_URL}</span>) — they will fail until those Netlify Functions and a real SearXNG instance are deployed.</div>

  ${qaRenderResultList('Calculation & multi-country logic (instant, no network)', calc)}

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <div>
        <h3 style="font-size:15px;">Search error-state handling (mocked — no real network)</h3>
        <div class="note">Verifies SEARCH_PROVIDER_UNAVAILABLE vs NETWORK_ERROR vs SUCCESS vs NO_RESULTS vs RETRY are classified and messaged correctly, and that place search never calls api.anthropic.com.</div>
      </div>
      <button class="btn brass sm" id="qaRunErrorTests">Run mocked error-state tests</button>
    </div>
    <div id="qaErrorResults" style="margin-top:12px;">${qaResults&&qaResults.errorTests ? qaRenderResultList('', qaResults.errorTests) : ''}</div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <div>
        <h3 style="font-size:15px;">Currency conversion engine (mocked — no real network)</h3>
        <div class="note">Same-currency shortcut, EUR→USD, USD→EUR by inversion, session caching, cached-rate fallback when the provider is down, and previous-working-day rates.</div>
      </div>
      <button class="btn brass sm" id="qaRunCurrencyTests">Run mocked currency tests</button>
    </div>
    <div id="qaCurrencyResults" style="margin-top:12px;">${qaResults&&qaResults.currencyTests ? qaRenderResultList('', qaResults.currencyTests) : ''}</div>
  </div>

  <div class="card" style="border-color:var(--stamp);">
    <h3 style="font-size:15px;">Live backend connectivity (calls your real deployed endpoints)</h3>
    <div class="note" style="margin-bottom:10px;">Each button below sends one real request to <span class="mono">${SEARCH_BACKEND_URL}</span>, which your Netlify Function forwards to SearXNG. These are opt-in and per-query on purpose — this app has no way to know whether a backend is deployed at that path until you click one. If nothing is deployed there yet, expect a NETWORK_ERROR or a 404, not a Claude/Waypoint error of any kind.</div>
    <div id="qaLiveResults"></div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
      ${[
        ['natural history','United States'],['museum','United States'],['natural history museum','United States'],
        ['American Museum of Natural History','United States'],['Zakynthos','Greece'],
        ['comic con','United States'],['bird watching','United States']
      ].map(([q,c],i)=>`<button class="btn ghost sm" data-qalive="${i}" data-q="${q}" data-c="${c}">${q}</button>`).join('')}
    </div>
  </div>
  `;
}

async function qaRunLiveQuery(query, countryName, btn){
  const out = document.getElementById('qaLiveResults');
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = 'Searching…';
  const row = document.createElement('div');
  row.className = 'item-row';
  row.innerHTML = `<div>"${query}" in ${countryName} <div class="item-meta">Searching verified sources…</div></div>`;
  out.appendChild(row);
  try{
    const results = await discoverPlaces(query, countryName, '', '', '', '');
    if(results && results.length){
      row.innerHTML = `<div>"${query}" in ${countryName}<div class="item-meta">Top match: ${results[0].name} (${results.length} result${results.length>1?'s':''})</div></div><span class="pill official">PASS</span>`;
    } else {
      row.innerHTML = `<div>"${query}" in ${countryName}<div class="item-meta">No matching verified information found.</div></div><span class="pill stale">NO RESULTS</span>`;
    }
  }catch(e){
    const info = classifyBackendError(e);
    row.innerHTML = `<div>"${query}" in ${countryName}<div class="item-meta">${info.title}</div></div><span class="pill secondary">${info.kind}</span>`;
  }finally{
    btn.disabled = false; btn.textContent = orig;
  }
}

function wireQA(){
  on('qaRunErrorTests','click', async ()=>{
    const el = document.getElementById('qaErrorResults');
    el.innerHTML = `<div class="loading-line"><div class="spinner"></div> Running mocked error-state tests…</div>`;
    const results = await runQaErrorStateTests();
    qaResults = qaResults || {}; qaResults.errorTests = results;
    el.innerHTML = qaRenderResultList('', results);
  });
  on('qaRunCurrencyTests','click', async ()=>{
    const el = document.getElementById('qaCurrencyResults');
    el.innerHTML = `<div class="loading-line"><div class="spinner"></div> Running mocked currency tests…</div>`;
    const results = await runQaCurrencyTests();
    qaResults = qaResults || {}; qaResults.currencyTests = results;
    el.innerHTML = qaRenderResultList('', results);
  });
  document.querySelectorAll('[data-qalive]').forEach(btn=>{
    btn.onclick = ()=> qaRunLiveQuery(btn.dataset.q, btn.dataset.c, btn);
  });
}

render();
</script>
</body>
</html>
